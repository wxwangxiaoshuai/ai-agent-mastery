[project]
name = "agent-scaffold"
version = "0.1.0"
description = "Agent 项目脚手架：Harness 基础设施开箱即用"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]